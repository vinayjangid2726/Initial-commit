<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon menu</title>
    <link rel="stylesheet" href="style2.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <div id="menu">
        <div id="nav-1">
            <div id="hamburger">
                <img src="./hamburger-menu-svgrepo-com.svg" alt="">
            </div>
            <div id="logo">
                <img src="./pokemon-logo-png-1426.png" alt="">
            </div>
            <div id="brightness">
                <img src="./Brightness--Streamline-Ultimate.png" alt="">
            </div>
        </div>


        <div id="nav-2">
            <div id="searchbar">
                <div id="mag"><img src="./Magnifying-Glass--Streamline-Core.svg" alt=""></div>
                <div id="text" style="opacity: 0.5; ">
                    Search for a pokemon...
                </div>
            </div>
            <div id="filter">
                <div id="filterbytext">
                    Filter by type (1) &nbsp; <i class="ri-arrow-down-line"></i>
                </div>
            </div>
            <div id="filterlogo">
                <i class="ri-sort-desc"></i>
            </div>
        </div>


        <div id="cards">
            <div id="card1">
                
               
            </div>
            <div id="card2"></div>
            <div id="card3"></div>
            <div id="card4"></div>
        </div>
        <div id="about">
            <div id="explore">
                <img src="https://play-lh.googleusercontent.com/NcKLbqZlBK60Np0iUcgrocPr1L2o_0nF3LWs8WG5Iuv15nL5ZlLJAF3IN73Y8_fGDkoZMfLNROX5ErRruQZFQg"
                    alt="">
                <div class="class">
                    <h5>Exlore</h5>
                    Discover all your favorite Pokémon
                </div>
            </div>
            <div id="filterrr">
                <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcTL4p05UsoWAEMV8sS8Dh2lVqcDP4TGqlzd7SmCpqzIeUKm_DrI"
                    alt="">
                <div class="class">
                    <h5>Filter</h5>
                    Find Pokémon by types and abilities
                </div>
            </div>
            <div id="collection">
                <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcSSN7YTe9Xlk6GPhFFfJfjV1uQHEHNTvF3aCxJewjI-3_-a7fAN"
                    alt="">
                <div class="class">
                    <h5>Collection</h5>
                        Save and manage your collection
                </div>
            </div>
            <div id="stats">
                <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcSVLkCoGJTAbupVbkmlF9vBkmxFxtsSpdenrFzivekp_RL8ef1C"   alt="">
                   <div class="class">
                       <h5>Stats</h5>
                       Save and manage your collection 
                   </div>
            </div>


        </div>
        <footer>

        </footer>
    </div>

</body>

</html>
